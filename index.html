            tart: perfumes.filter(p => p.type === 'tart').length,

        document.querySelectorAll('.type-btn').forEach(btn => {
            const type = btn.dataset.type;
            const span = btn.querySelector('.count');
            if (span && counts[type] !== undefined) {
                span.textContent = `(${counts[type] || 0})`;
            }
        });

        const overlay = document.getElementById('photoOverlay');
        const photoFull = document.getElementById('photoFull');
        const closeBtn = document.getElementById('photoClose');

        function openPhoto(src) {
            if (!src || src === '') return;
            photoFull.src = 'images/' + src;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePhoto() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closePhoto);
        overlay.addEventListener('click', function(e) {
            if (e.target === this) closePhoto();
        });

        function renderStars(rating) {
            let html = '';
            for (let i = 0; i < 5; i++) {
                html += `<svg viewBox="0 0 24 24" class="${i < rating ? '' : 'empty'}"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
            }
            return html;
        }

        function renderReviews() {
            return `
                <div class="reviews-section">
                    <div class="reviews-title">
                        💬 Отзывы <span>наших клиентов</span>
                        <span class="count">${reviews.length}</span>
                    </div>
                    <div class="reviews-grid">
                        ${reviews.map(r => `
                            <div class="review-card">

                                    <div class="review-avatar">👤</div>
                                    <div class="review-info">
                                        <div class="review-name">${r.name}</div>
                                        <div class="review-city">${r.city}</div>
                                        <div class="review-stars">${renderStars(r.rating)}</div>
                                    </div>
                                </div>
                                <div class="review-text">${r.text}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderCatalog(type = 'all') {
            const container = document.getElementById('catalog');

            if (type === 'reviews') {
                container.innerHTML = renderReviews();
                return;
            }

            if (type === 'all') {

                        <div class="divider"></div>

                        <p>В их составе — <span class="highlight">драгоценные ингредиенты</span>: редкие сорта розы, жасмина, ириса, амбра, ветивер, экстракты экзотических растений.</p>
                        <p><span class="highlight">Ориентальные и шипровые нюансы</span> — ваниль, мускус, пачули — создают тёплый, притягательный фон.</p>
                    </div>
                `;
            }

            let filtered = perfumes;
            if (type !== 'all') {
                filtered = perfumes.filter(p => p.type === type);
            }

            if (filtered.length === 0) {
                container.innerHTML = moneyBlock + '<div class="empty">😕 Нет ароматов в этой категории</div>';
                return;
            }

            const grouped = {};
            if (type === 'all') {
                filtered.forEach(p => {
                    if (!grouped[p.type]) grouped[p.type] = [];
                    grouped[p.type].push(p);
                });
            } else {
                grouped[type] = filtered;
            }

            const typeOrder = ['warm', 'tart', 'fresh', 'floral', 'sweet', 'woody'];
            const sortedTypes = Object.keys(grouped).sort((a, b) => typeOrder.indexOf(a) - typeOrder.indexOf(b));

            let html = moneyBlock;

            for (const t of sortedTypes) {

                html += `<div class="section-title">${typeNames[t] || t} <span class="badge">${items.length}</span></div>`;

            container.innerHTML = html;
